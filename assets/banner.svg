<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0F17"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C9A24B"/>
      <stop offset="1" stop-color="#E8C77A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#C9A24B" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#C9A24B" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1F2937" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="16" fill="url(#grid)" opacity="0.55"/>
  <rect width="1200" height="300" rx="16" fill="url(#glow)"/>

  <!-- node graph: server -> api -> db -->
  <g stroke="#C9A24B" stroke-opacity="0.55" stroke-width="2" fill="none">
    <path d="M880 150 L975 95"/>
    <path d="M880 150 L975 205"/>
    <path d="M975 95 L1075 150"/>
    <path d="M975 183 L975 117"/>
  </g>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">
    <rect x="830" y="128" width="100" height="44" rx="10" fill="#111827" stroke="#C9A24B" stroke-width="1.5"/>
    <text x="880" y="155" fill="#E5E7EB">Nginx</text>
    <rect x="925" y="73" width="100" height="44" rx="10" fill="#111827" stroke="#C9A24B" stroke-width="1.5"/>
    <text x="975" y="100" fill="#E5E7EB">ASP.NET Core</text>
    <rect x="925" y="183" width="100" height="44" rx="10" fill="#111827" stroke="#C9A24B" stroke-width="1.5"/>
    <text x="975" y="210" fill="#E5E7EB">Next.js</text>
    <rect x="1025" y="128" width="100" height="44" rx="10" fill="#111827" stroke="#C9A24B" stroke-width="1.5"/>
    <text x="1075" y="155" fill="#E5E7EB">PostgreSQL</text>
  </g>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="72" y="74" width="40" height="3" rx="1.5" fill="url(#gold)"/>
    <text x="124" y="80" fill="#C9A24B" font-size="14" font-weight="600" letter-spacing="3">VG2 IT-UTVIKLING · ÅSSIDEN VGS</text>
    <text x="72" y="148" fill="#F9FAFB" font-size="54" font-weight="700">Ali Badr Almrabhi</text>
    <text x="72" y="190" fill="#9CA3AF" font-size="22">Backend med C# og .NET  ·  Linux og serverdrift</text>
    <rect x="72" y="214" width="330" height="36" rx="18" fill="#C9A24B" fill-opacity="0.12" stroke="#C9A24B" stroke-opacity="0.6"/>
    <circle cx="94" cy="232" r="5" fill="#22C55E"/>
    <text x="108" y="238" fill="#E8C77A" font-size="16" font-weight="600">Søker læreplass og deltidsjobb</text>
  </g>
</svg>
