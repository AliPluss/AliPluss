<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0F17"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C9A24B"/>
      <stop offset="1" stop-color="#E8C77A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#C9A24B" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#C9A24B" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1F2937" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="16" fill="url(#grid)" opacity="0.55"/>
  <rect width="1200" height="300" rx="16" fill="url(#glow)"/>

  <!-- node graph: nginx -> web/api -> db -->
  <g stroke="#C9A24B" stroke-opacity="0.5" stroke-width="2" fill="none" stroke-dasharray="4 6">
    <path id="e1" d="M860 140 L900 96"/>
    <path id="e2" d="M860 160 L900 204"/>
    <path id="e4" d="M960 193 L960 107"/>
    <path id="e3" d="M1020 96 L1060 140"/>
    <animate attributeName="stroke-dashoffset" from="20" to="0" dur="1.2s" repeatCount="indefinite"/>
  </g>
  <g fill="#E8C77A">
    <circle r="3.5"><animateMotion dur="1.6s" repeatCount="indefinite"><mpath href="#e1"/></animateMotion></circle>
    <circle r="3.5"><animateMotion dur="1.6s" begin="0.4s" repeatCount="indefinite"><mpath href="#e2"/></animateMotion></circle>
    <circle r="3.5"><animateMotion dur="1.6s" begin="0.8s" repeatCount="indefinite"><mpath href="#e4"/></animateMotion></circle>
    <circle r="3.5"><animateMotion dur="1.6s" begin="1.2s" repeatCount="indefinite"><mpath href="#e3"/></animateMotion></circle>
  </g>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle">
    <rect x="760" y="128" width="100" height="44" rx="10" fill="#111827" stroke="#C9A24B" stroke-width="1.5"/>
    <text x="810" y="155" fill="#E5E7EB">Nginx</text>
    <rect x="900" y="63" width="120" height="44" rx="10" fill="#111827" stroke="#C9A24B" stroke-width="1.5"/>
    <text x="960" y="90" fill="#E5E7EB">ASP.NET Core</text>
    <rect x="900" y="193" width="120" height="44" rx="10" fill="#111827" stroke="#C9A24B" stroke-width="1.5"/>
    <text x="960" y="220" fill="#E5E7EB">Next.js</text>
    <rect x="1060" y="128" width="110" height="44" rx="10" fill="#111827" stroke="#C9A24B" stroke-width="1.5"/>
    <text x="1115" y="155" fill="#E5E7EB">PostgreSQL</text>
  </g>
  <text x="965" y="268" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#6B7280" text-anchor="middle" letter-spacing="2">PROXMOX · ROCKY LINUX · DOCKER</text>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="72" y="74" width="40" height="3" rx="1.5" fill="url(#gold)"/>
    <text x="124" y="80" fill="#C9A24B" font-size="14" font-weight="600" letter-spacing="3">VG2 IT-UTVIKLING · ÅSSIDEN VGS</text>
    <text x="72" y="148" fill="#F9FAFB" font-size="54" font-weight="700">Ali Badr Almrabhi<tspan fill="#C9A24B">_<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/></tspan></text>
    <text x="72" y="190" fill="#9CA3AF" font-size="22">Backend med C# og .NET  ·  Linux og serverdrift</text>
    <rect x="72" y="214" width="330" height="36" rx="18" fill="#C9A24B" fill-opacity="0.12" stroke="#C9A24B" stroke-opacity="0.6"/>
    <circle cx="94" cy="232" r="5" fill="#22C55E"/>
    <circle cx="94" cy="232" r="5" fill="none" stroke="#22C55E" stroke-width="2">
      <animate attributeName="r" values="5;12" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="108" y="238" fill="#E8C77A" font-size="16" font-weight="600">Søker læreplass og deltidsjobb</text>
  </g>
</svg>
